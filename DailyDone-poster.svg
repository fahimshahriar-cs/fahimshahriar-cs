<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">DailyDone — Small tasks. Big progress.</title><desc id="desc">Animated lavender app poster with a task dashboard, progress meter and phone mockup.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#100d1f"/><stop offset=".55" stop-color="#211632"/><stop offset="1" stop-color="#102536"/></linearGradient><linearGradient id="violet" x2="1"><stop stop-color="#b69aff"/><stop offset=".55" stop-color="#eea7ff"/><stop offset="1" stop-color="#8be9ff"/></linearGradient><linearGradient id="mint" x2="1"><stop stop-color="#50f2ad"/><stop offset="1" stop-color="#7ee7ff"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#c4b5fd" stroke-opacity=".07"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="360" rx="26" fill="url(#bg)"/><rect width="1200" height="360" rx="26" fill="url(#grid)"/><circle cx="144" cy="74" r="110" fill="#b69aff" opacity=".08"><animate attributeName="r" values="92;120;92" dur="7s" repeatCount="indefinite"/></circle><path d="M0 310 Q260 240 520 322T1200 282" fill="none" stroke="url(#violet)" stroke-opacity=".35" stroke-width="2"/><rect x="34" y="30" width="1132" height="300" rx="22" fill="#0b0a14" fill-opacity=".58" stroke="#c4b5fd" stroke-opacity=".3"/><g transform="translate(76 82)"><rect width="475" height="184" rx="18" fill="#17142a" stroke="#a78bfa" stroke-opacity=".52"/><circle cx="26" cy="27" r="5" fill="#fb7185"/><circle cx="44" cy="27" r="5" fill="#39ff78"/><circle cx="62" cy="27" r="5" fill="#38d9ff"/><text x="84" y="32" fill="#a99bc4" font-family="monospace" font-size="12" letter-spacing="1.6">DAILY DASHBOARD <animate attributeName="opacity" values=".6;1;.6" dur="3s" repeatCount="indefinite"/></text><text x="24" y="70" fill="#eee8ff" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Today, one task at a time.</text><g font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#ddd5ed"><rect x="22" y="89" width="431" height="28" rx="8" fill="#232039"/><circle cx="39" cy="103" r="7" fill="#50f2ad"/><path d="M35 103l3 3 6-7" fill="none" stroke="#101d25" stroke-width="2"/><text x="57" y="108">Plan the day</text><text x="410" y="108" fill="#67edb5">DONE</text><rect x="22" y="124" width="431" height="28" rx="8" fill="#232039"/><circle cx="39" cy="138" r="7" fill="none" stroke="#b69aff" stroke-width="2"/><text x="57" y="143">Build something useful</text><text x="394" y="143" fill="#b69aff">NEXT</text></g><text x="24" y="174" fill="#b8adc9" font-family="monospace" font-size="11">DAILY PROGRESS</text><rect x="145" y="165" width="245" height="9" rx="5" fill="#34304b"/><rect x="145" y="165" width="0" height="9" rx="5" fill="url(#mint)"><animate attributeName="width" values="0;156;156;0" dur="5s" repeatCount="indefinite"/></rect><text x="405" y="174" fill="#80f0c1" font-family="monospace" font-size="11">2 / 3</text></g><g transform="translate(762 50)"><rect width="180" height="248" rx="28" fill="#0c0b15" stroke="url(#violet)" stroke-width="3"/><rect x="12" y="18" width="156" height="218" rx="19" fill="#1b1730"/><rect x="62" y="8" width="56" height="5" rx="3" fill="#8778a8"/><text x="28" y="55" fill="#b69aff" font-family="monospace" font-size="12" letter-spacing="1">DAILYDONE</text><text x="28" y="82" fill="#f3edff" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">My tasks</text><rect x="25" y="99" width="130" height="37" rx="10" fill="#292341"/><circle cx="42" cy="117" r="8" fill="#50f2ad"/><path d="M38 117l3 3 6-7" fill="none" stroke="#101d25" stroke-width="2"/><text x="57" y="121" fill="#eee8ff" font-family="Segoe UI,Arial,sans-serif" font-size="11">Daily stretch</text><rect x="25" y="145" width="130" height="37" rx="10" fill="#292341"/><circle cx="42" cy="163" r="8" fill="none" stroke="#c4b5fd" stroke-width="2"/><text x="57" y="167" fill="#eee8ff" font-family="Segoe UI,Arial,sans-serif" font-size="11">Read 10 pages</text><rect x="25" y="199" width="130" height="8" rx="4" fill="#3a3452"/><rect x="25" y="199" width="12" height="8" rx="4" fill="url(#mint)"><animate attributeName="width" values="12;84;84;12" dur="5s" repeatCount="indefinite"/></rect><circle cx="158" cy="36" r="5" fill="#39ff78" filter="url(#glow)"><animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></circle></g><g transform="translate(970 105)"><text fill="url(#violet)" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" filter="url(#glow)">DailyDone<animate attributeName="opacity" values=".82;1;.82" dur="3.6s" repeatCount="indefinite"/></text><text x="3" y="34" fill="#eee8ff" font-family="Segoe UI,Arial,sans-serif" font-size="17">Small tasks. Big progress.</text><text x="3" y="69" fill="#8be9ff" font-family="monospace" font-size="12">OFFLINE-READY · ANDROID APP</text><path d="M3 95h170" stroke="#b69aff" stroke-opacity=".45"/><text x="3" y="125" fill="#70e8b2" font-family="monospace" font-size="12">&gt; focus_mode --start</text><text x="3" y="151" fill="#b8adc9" font-family="monospace" font-size="11">YOUR DAY, YOUR PACE</text><circle cx="155" cy="120" r="4" fill="#38d9ff"><animate attributeName="cx" values="155;175;155" dur="2.4s" repeatCount="indefinite"/></circle></g><text x="76" y="305" fill="#b9adcf" font-family="monospace" font-size="12" letter-spacing="1">PERSONAL PROJECT • BUILT WITH HTML, CSS &amp; JAVASCRIPT</text></svg>
